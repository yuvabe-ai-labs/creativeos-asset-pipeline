<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="brand">
      <div>
        <p class="brand-name">CreativeOS</p>
        <p class="brand-sub">Moodboard Clipper</p>
      </div>
    </header>

    <p id="current" class="current"></p>

    <label class="field">
      <span class="eyebrow">Client</span>
      <select id="client"></select>
    </label>

    <p class="eyebrow boards-label">Boards</p>
    <div id="boards" class="boards"></div>

    <label class="field" for="note"><span class="eyebrow">Note for the next clip</span></label>
    <textarea id="note" rows="2" placeholder="What caught your eye?"></textarea>

    <button id="refresh" class="refresh">Refresh</button>
    <p id="status" class="status"></p>
    <p id="server" class="server"></p>
    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
