# Every push to main deploys the Trigger.dev workers to the production Trigger project, then
# builds the production image and deploys it to Cloud Run (D489). Workers go first so a task
# the new app calls already exists; if they fail, the app is not deployed.
# Trigger settings live on the "production" GitHub Environment; see trigger-deploy.yml.
# GCP access is keyless (Workload Identity Federation, scripts/gcp/setup-cicd.sh) and only
# trusted for this repo's main branch. Secrets live in Secret Manager and are already wired
# into the service, so the deploy only swaps the image — every other setting is kept.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; a newer push waits for the one in flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for GCP

env:
  PROJECT: yuvabe-500205
  REGION: australia-southeast1
  SERVICE: creativeos-yuvabe
  IMAGE: australia-southeast1-docker.pkg.dev/yuvabe-500205/creativeos/app:${{ github.sha }}

jobs:
  trigger:
    uses: ./.github/workflows/trigger-deploy.yml
    with:
      environment: production
    secrets: inherit

  deploy:
    needs: trigger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/654192369762/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: creativeos-deployer@yuvabe-500205.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # An empty value would still build, then ship a bundle with no Supabase config.
      - name: Check build variables
        run: |
          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" || { echo "::error::Repo variable NEXT_PUBLIC_SUPABASE_URL is not set"; exit 1; }
          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" || { echo "::error::Repo variable NEXT_PUBLIC_SUPABASE_ANON_KEY is not set"; exit 1; }

      # NEXT_PUBLIC_* are compiled into the browser bundle, so they are build inputs. Both are
      # public by design (the anon key ships to every browser) — repo variables, not secrets.
      # An explicit staging dir skips gcloud's default-bucket ownership check, which lists every
      # bucket in the project; the deployer only has access to this one bucket.
      - name: Build image (Cloud Build)
        run: >
          gcloud builds submit --project="$PROJECT" --config=cloudbuild.yaml
          --gcs-source-staging-dir="gs://${PROJECT}_cloudbuild/source"
          --substitutions="_IMAGE=${IMAGE},_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          .

      - name: Deploy to Cloud Run
        run: gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE"

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/login")"
          echo "$url/login -> $code"
          test "$code" = "200"
