# Every push to main builds the production image and deploys it to Cloud Run.
# GCP access is keyless (Workload Identity Federation, scripts/gcp/setup-cicd.sh) and only
# trusted for this repo's main branch. Secrets live in Secret Manager and are already wired
# into the service, so the deploy only swaps the image — every other setting is kept.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; a newer push waits for the one in flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for GCP

env:
  PROJECT: yuvabe-500205
  REGION: australia-southeast1
  SERVICE: creativeos-yuvabe
  IMAGE: australia-southeast1-docker.pkg.dev/yuvabe-500205/creativeos/app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/654192369762/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: creativeos-deployer@yuvabe-500205.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # NEXT_PUBLIC_* are compiled into the browser bundle, so they are build inputs. Both are
      # public by design (the anon key ships to every browser) — repo variables, not secrets.
      - name: Build image (Cloud Build)
        run: >
          gcloud builds submit --project="$PROJECT" --config=cloudbuild.yaml
          --substitutions="_IMAGE=${IMAGE},_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          .

      - name: Deploy to Cloud Run
        run: gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE"

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/login")"
          echo "$url/login -> $code"
          test "$code" = "200"
