# Builds the production image (Dockerfile). Invoked by scripts/gcp/deploy-prod.sh, which
# supplies the substitutions — NEXT_PUBLIC_* must exist at build time.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
