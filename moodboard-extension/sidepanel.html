<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <h1>Moodboard target</h1>
    <p id="current" class="current"></p>
    <label class="field">Client
      <select id="client"></select>
    </label>
    <div id="boards" class="boards"></div>
    <label class="field" for="note">Note for the next clip (optional)</label>
    <textarea id="note" rows="2" placeholder="What caught your eye?"></textarea>
    <button id="refresh" class="refresh">Refresh</button>
    <p id="status" class="status"></p>
    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
