<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Glow rises from below the circle; warm stops route yellow through
         orange/pink into purple so the blend never grays out. -->
    <radialGradient id="g" gradientUnits="userSpaceOnUse" cx="16" cy="35" r="38">
      <stop offset="0" stop-color="#ffca2d"/>
      <stop offset="0.16" stop-color="#ffab38"/>
      <stop offset="0.34" stop-color="#f0679b"/>
      <stop offset="0.55" stop-color="#8f3fd6"/>
      <stop offset="0.8" stop-color="#5829c7"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#g)"/>
</svg>
